app:
  tavily:
    api-key: ${TAVILY_API_KEY}
server:
  port: 8081
spring:
  jpa:
    hibernate:
      ddl-auto: update
  application:
    name: chatclientpdfsearch
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/chatbotdb}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgress}

  ai:

    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: gpt-4.1-mini
      embeddings:
        options:
          model: text-embedding-3-small

    vectorstore:
      pgvector:
        initialize-schema: true