server:
  port: 8081
spring:
  application:
    name: chatclientpdfsearch
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  datasource:
    url: jdbc:postgresql://localhost:5432/chatbotdb
    username: postgres
    password: postgress

  ai:

    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: gpt-4.1-mini
      embeddings:
        options:
          model: text-embedding-3-small

    vectorstore:
      pgvector:
        initialize-schema: true